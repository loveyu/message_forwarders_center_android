version: "1.0"

inputs:
  vpn:
    - name: home_vpn_primary
      configUrl: https://example.com/vpn/home-primary.yaml
      coreUrl: https://github.com/MetaCubeX/mihomo/releases/download/v1.19.10/mihomo-android-arm64-v8a-v1.19.10.gz
      enabled: true
      when: network=wifi&ssid=HomeWiFi
      accessControlMode: include
      packages:
        - com.android.chrome
        - com.termux

    - name: home_vpn_backup
      configUrl: https://example.com/vpn/home-backup.yaml
      coreUrl: https://github.com/MetaCubeX/mihomo/releases/download/v1.19.9/mihomo-android-arm64-v8a-v1.19.9.gz
      enabled: true
      when: network=wifi&ssid=HomeWiFi
      accessControlMode: exclude
      packages:
        - info.loveyu.mfca
